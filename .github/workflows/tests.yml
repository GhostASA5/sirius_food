name: tests
on: [push, pull_request]
jobs:
  pytest:
    name: required-tests
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: sirius
          RABBITMQ_DEFAULT_PASS: sirius
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m scripts.generate_proto
      - name: Unit and API tests
        run: pytest tests --ignore=tests/integration --ignore=tests/contracts -q
      - name: PostgreSQL integration tests
        run: pytest tests/integration -v
      - name: Pact message contract
        run: pytest tests/contracts -v
