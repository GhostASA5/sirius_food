x-observability: &observability
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  app:
    build: .
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-app
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SIMULATE_EMAIL_FAILURES: ${SIMULATE_EMAIL_FAILURES:-false}
      DELIVERY_GRPC_TARGET: delivery:50051
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      delivery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
  delivery:
    build: .
    command: python -m delivery_service.server
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-delivery
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -Q default
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-worker
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SIMULATE_EMAIL_FAILURES: ${SIMULATE_EMAIL_FAILURES:-false}
    depends_on:
      redis:
        condition: service_healthy
  outbox:
    build: .
    command: python -m app.workers.outbox_publisher
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-outbox
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  loyalty_worker:
    build: .
    command: python -m app.workers.loyalty_consumer
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-loyalty_worker
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
      LOYALTY_SILVER: ${LOYALTY_SILVER:-100}
      LOYALTY_GOLD: ${LOYALTY_GOLD:-500}
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  beat:
    build: .
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-beat
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      worker:
        condition: service_started
  kitchen:
    build: .
    command: python -m app.workers.kitchen_consumer
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-kitchen
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  delivery_worker:
    build: .
    command: python -m delivery_service.delivery_worker
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-delivery_worker
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  compensation:
    build: .
    command: python -m app.workers.compensation_consumer
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-compensation
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  search_worker:
    build: .
    command: sh -c "python -m scripts.reindex_menu && exec python -m app.workers.search_consumer"
    environment:
      <<: *observability
      OTEL_SERVICE_NAME: sirius-search_worker
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_food"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management
    volumes:
      - ./monitoring/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: sirius
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/sirius.json:ro

volumes:
  pg_data:
  rabbitmq_data:
  elastic_data:
