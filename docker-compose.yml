services:
  app:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SIMULATE_EMAIL_FAILURES: ${SIMULATE_EMAIL_FAILURES:-false}
      DELIVERY_GRPC_TARGET: delivery:50051
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      delivery:
        condition: service_healthy
  delivery:
    build: .
    command: python -m delivery_service.server
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -Q default
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SIMULATE_EMAIL_FAILURES: ${SIMULATE_EMAIL_FAILURES:-false}
    depends_on:
      redis:
        condition: service_healthy
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_food"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pg_data:
